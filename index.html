<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <nav class="navbar navbar-dark bg-dark shadow">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            🎓 EduTrack Portal
        </span>

    </div>

</nav>

<div class="container mt-5">

    <h1 class="text-center mb-4" style="color :black">
         EduTrack Portal
    </h1>

    <div class="card p-4">

        <input type="text" id="name" class="form-control mb-3" placeholder="Enter Student Name">

        <input type="text" id="department" class="form-control mb-3" placeholder="Enter Department">

        <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">

        <button class="btn btn-primary" onclick="addStudent()">
            Add Student
        </button>

    </div>
    <input
type="text"
id="search"
class="form-control mt-4"
placeholder="Search Student"
onkeyup="searchStudent()"
>

    <table class="table table-bordered mt-4">

        <thead>

            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="studentList">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

<footer class="text-center text-white mt-4 mb-3">

    Developed by Baranitha.

</footer>

</body>
</html>
